name: Publish to NPM and Deploy Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Trusted publishing requires Node >= 22.14.0 (npm docs)
          node-version: '22.14'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        # Trusted publishing requires npm CLI >= 11.5.1
        run: npm install --global npm@11.10.0

      - name: Install dependencies
        run: npm i

      - name: Initialize required submodules
        run: git submodule update --init --recursive libs/Open-Cap-Format-OCF

      - name: Build package
        run: npm run build

      - name: Run unit tests with coverage
        run: npm run test:ci

      - name: Test declarations
        run: npm run test:declarations

      # prepare-release only moves up from npm's `latest`. When package.json names a version that is not on npm yet
      # and has no tag, publish it as written: that is how this line went back to 0.8.x (v34, the contracts on
      # DevNet) after the 0.9.x v35 releases. Otherwise prepare-release picks the next patch as usual.
      - name: Prepare release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! npm view "@open-captable-protocol/canton@$VERSION" version >/dev/null 2>&1 \
            && ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Publishing package.json version $VERSION as written"
          else
            npm run prepare-release
          fi

      - name: Check package artifacts
        run: npm run check:package-artifacts

      # Publishes via npm Trusted Publisher (OIDC); do not set NODE_AUTH_TOKEN here. The explicit tag lets a
      # release below the current `latest` (0.8.24 after 0.9.8) take over `latest`.
      - name: Publish to NPM
        run: npm publish --tag latest

      - name: Create and push git tag
        run: |
          # Get the new version from package.json
          NEW_VERSION=$(node -p "require('./package.json').version")

          # Create git tag
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"
          git push origin "v$NEW_VERSION"
